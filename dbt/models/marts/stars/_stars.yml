version: 2

models:
  - name: dim_award_levels
    description: "Dimension of institutional award levels"
    columns:
      - name: award_level
        data_type: int64
        constraints:
          - type: primary_key
        tests:
          - not_null
          - unique

      - name: award_level_description
        data_type: string

      - name: award_level_category
        data_type: string

  - name: dim_cip_codes
    description: "Dimension of IPEDS CIP codes"
    columns:
      - name: cip_code
        data_type: string
        constraints:
          - type: primary_key
        tests:
          - not_null
          - unique

      - name: cip_title
        data_type: string

      - name: cip_family_title
        data_type: string

      - name: is_stem
        data_type: boolean

  - name: dim_institutions
    description: "Dimension of institutional characteristics by IPEDS survey year"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - survey_year
              - institution_id
    columns:
      - name: institution_key
        data_type: string
        constraints:
          - type: primary_key
        tests:
          - not_null
          - unique

      - name: survey_year
        data_type: int64

      - name: institution_id
        data_type: int64

      - name: institution_name
        data_type: string

      - name: state_county
        data_type: string

      - name: state_abbreviation
        data_type: string

  - name: dim_survey_years
    description: "Dimension of IPEDS survey years"
    columns:
      - name: survey_year
        data_type: int64
        constraints:
          - type: primary_key
        tests:
          - not_null
          - unique

      - name: academic_year
        data_type: string

  - name: fct_completions
    description: "One big table of student completions by years, institutions, CIP codes, and award levels."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - survey_year
              - institution_id
              - cip_code
              - award_level
    columns:
      - name: survey_year
        data_type: int64
        tests:
          - not_null

      - name: academic_year
        data_type: string

      - name: institution_id
        data_type: string
        tests:
          - not_null

      - name: institution_name
        data_type: string

      - name: state_county
        data_type: string

      - name: state_abbreviation
        data_type: string

      - name: cip_code
        data_type: string
        tests:
          - not_null

      - name: cip_title
        data_type: string

      - name: cip_family_title
        data_type: string

      - name: is_stem
        data_type: string

      - name: award_level
        data_type: string
        tests:
          - not_null

      - name: award_level_description
        data_type: string

      - name: award_level_category
        data_type: string

      - name: total_completions
        data_type: int64

      - name: male_completions
        data_type: int64

      - name: female_completions
        data_type: int64

      - name: completion_key
        data_type: string
        tests:
          - not_null
          - unique