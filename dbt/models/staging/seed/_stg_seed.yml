version: 2

models:
  - name: stg_seed__award_level_codes
    description: "Static: Award Levels"
    columns:
      - name: award_level
        data_type: int64
        tests:
          - not_null
          - unique
      - name: award_level_description
        data_type: string

      - name: award_level_category
        data_type: string

  - name: stg_seed__cip_codes
    description: "Static: CIP Codes 2020"
    columns:
      - name: cip_code
        data_type: string
        tests:
          - not_null
          - unique

      - name: cip_family
        data_type: string

      - name: cip_title
        data_type: string

      - name: cip_definition
        data_type: string

      - name: cip_family_title
        data_type: string

      - name: is_stem
        data_type: boolean

  - name: stg_seed__survey_years
    description: "Static: IPEDS Survey Years (2018-2024)"
    columns:
      - name: survey_year
        data_type: int64
        tests:
          - not_null
          - unique

      - name: academic_year
        data_type: string

      - name: carnegie_vintage
        data_type: int64
        description: ""